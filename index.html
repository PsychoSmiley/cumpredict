let voiceHovering = false, voiceTransitioning = false;

function syncVoiceIcon() {
  if (voiceTransitioning) return; // a fade frame is showing -- don't stomp it
  voiceBtn.textContent = voiceActive ? VOICE_STOP : (voiceHovering ? VOICE_DIAL : VOICE_MIC);
}
function fadeVoiceIcon(emoji, holdMs) {
  voiceTransitioning = true;
  voiceBtn.style.opacity = "0";
  setTimeout(() => {
    voiceBtn.textContent = emoji;
    voiceBtn.style.opacity = "1";
    setTimeout(() => { voiceTransitioning = false; syncVoiceIcon(); }, holdMs);
  }, 150);
}

function startVoice() {
  voiceRecognition = new SpeechRecognitionCtor();
  voiceRecognition.lang = VOICE_RECOG_LANG[voiceLangKey];
  voiceRecognition.continuous = true;
  voiceRecognition.interimResults = false;
  voiceRecognition.onresult = (e) => {
    const words = e.results[e.results.length - 1][0].transcript.toLowerCase().trim().split(/\s+/);
    for (const w of words) {
      const digit = /^[0-9]$/.test(w) ? Number(w) : VOICE_WORD_TO_LEVEL[w];
      if (digit !== undefined) pushPress(digit / 9.0);
    }
  };
  voiceRecognition.onerror = (e) => {
    logLine(`voice input error: ${e.error}`);
    voiceActive = false;
    voiceTransitioning = false;
    syncVoiceIcon();
  };
  // Some browsers stop listening after a pause even with continuous=true -- restart while the
  // toggle is still on. onerror (above) clears voiceActive first, so a real failure (e.g. denied
  // permission) does not loop here.
  voiceRecognition.onend = () => { if (voiceActive) voiceRecognition.start(); };
  voiceRecognition.start();
}

const voiceBtn = document.getElementById("voiceToggle");
if (!SpeechRecognitionCtor) {
  voiceBtn.disabled = true;
  voiceBtn.title = "voice input isn't supported in this browser";
} else {
  voiceBtn.addEventListener("mouseenter", () => { voiceHovering = true; syncVoiceIcon(); });
  voiceBtn.addEventListener("mouseleave", () => { voiceHovering = false; syncVoiceIcon(); });
  voiceBtn.addEventListener("click", () => {
    if (voiceActive) {
      voiceActive = false;
      if (voiceRecognition) voiceRecognition.stop();
      fadeVoiceIcon(VOICE_KBD, 2000);
    } else {
      voiceActive = true;
      startVoice();
      fadeVoiceIcon(VOICE_HANDS, 2000);
    }
  });
}

// ---- live session: large slider, the primary input on mobile (numpads don't exist, voice isn't
// always convenient) but usable on desktop too. One press per drag-release ("change"), not one per
// pixel of drag ("input", used only for the live readout) -- a rating is a deliberate act. ----
document.getElementById("labelSlider").addEventListener("input", (e) => {
  document.getElementById("labelSliderVal").textContent = e.target.value;
});
document.getElementById("labelSlider").addEventListener("change", (e) => {
  pushPress(Number(e.target.value) / 9.0);
});

// Dedicated Worker for sleepMs -- a backgrounded/unfocused tab throttles the MAIN thread's
// setTimeout to roughly once a second in most browsers, which would stretch a 130ms stroke's
// movement-wait loop into multi-second steps and badly distort a live session's pacing while
// tabbed away (the requirement is to keep running at normal pace in the background, not just
// avoid crashing -- switching tabs to read something else shouldn't slow the session down).
// Dedicated Workers are not subject to that same throttling, so routing every wait through one
// fixes it everywhere at once, since all pacing already goes through this single function.
// Inlined via a Blob URL so this stays one self-contained file, no separate .js to ship.
const sleepWorker = new Worker(URL.createObjectURL(new Blob(
  ["onmessage = (e) => setTimeout(() => postMessage(e.data), e.data.ms);"],
  { type: "application/javascript" }
)));
let sleepReqId = 0;
const sleepPending = new Map();
sleepWorker.onmessage = (e) => {
  const resolve = sleepPending.get(e.data.id);
  if (resolve) { sleepPending.delete(e.data.id); resolve(); }
};
function sleepMs(ms) {
  return new Promise((resolve) => {
    const id = sleepReqId++;
    sleepPending.set(id, resolve);
    sleepWorker.postMessage({ id, ms });
  });
}
function withTimeout(promise, ms) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error("device command timed out")), ms);
    promise.then((v) => { clearTimeout(t); resolve(v); }, (e) => { clearTimeout(t); reject(e); });
  });
}

// ---- live session: IndexedDB cache (rows + policy), so a returning user's own sessions layer on
// top of sessions.csv for the next retrain by default, with no separate upload step. Rows are
// added one at a time as they happen (see liveMainLoop), not buffered to the end -- a brutally
// closed tab keeps whatever was recorded up to that point, and unrated labels are precious. ----
const IDB_NAME = "cumpredict", IDB_VERSION = 1;
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("liveRows"))
        db.createObjectStore("liveRows", { keyPath: "id", autoIncrement: true }).createIndex("session", "session");
      if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "key" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGetAllRows(db) {
  return new Promise((resolve, reject) => {
    const req = db.transaction("liveRows", "readonly").objectStore("liveRows").getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbAddRow(db, row) {
  return new Promise((resolve, reject) => {
    const req = db.transaction("liveRows", "readwrite").objectStore("liveRows").add(row);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbDeleteSession(db, session) {
  return new Promise((resolve, reject) => {
    const store = db.transaction("liveRows", "readwrite").objectStore("liveRows");
    const req = store.index("session").openCursor(IDBKeyRange.only(session));
    req.onsuccess = () => {
      const cur = req.result;
      if (cur) { cur.delete(); cur.continue(); } else resolve();
    };
    req.onerror = () => reject(req.error);
  });
}
function idbClearRows(db) {
  return new Promise((resolve, reject) => {
    const req = db.transaction("liveRows", "readwrite").objectStore("liveRows").clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
function idbGetMeta(db, key) {
  return new Promise((resolve, reject) => {
    const req = db.transaction("meta", "readonly").objectStore("meta").get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : null);
    req.onerror = () => reject(req.error);
  });
}
function idbSetMeta(db, key, value) {
  return new Promise((resolve, reject) => {
    const req = db.transaction("meta", "readwrite").objectStore("meta").put({ key, value });
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

let liveDb = null;

// Reuses the existing CSV parser instead of a second one: cached rows have the exact same 4
// columns sessions.csv does, so round-tripping through CSV text gets session-grouping and every
// existing validation for free. Idempotent -- safe to call again after a session ends or the
// cache is cleared, since it first strips any live sessions it added last time.
async function loadLiveCacheIntoSessions() {
  liveDb = liveDb || await idbOpen();
  sessions = sessions.filter((s) => !/^(?:VIB_)?live\d+$/.test(s.name));
  const rows = await idbGetAllRows(liveDb);
  hasLiveCacheRows = rows.length > 0;
  refreshTrainRow();
  if (!rows.length) { setChip("livecache", null, "live cache"); return; }
  const bySession = new Set(rows.map((r) => r.session));
  const lines = ["session,time_elapse,intensity,tired_level"];
  for (const r of rows) lines.push(`${r.session},${r.time_elapse},${r.intensity},${r.tired_level}`);
  const cached = window.CumPredict.loadSessionsFromCsvText(lines.join("\n"), "live", logLine);
  sessions = sessions.concat(cached);
  setChip("livecache", `live cache (${bySession.size} session${bySession.size === 1 ? "" : "s"}, ${rows.length} rows)`, "live cache");
  logLine(`loaded ${rows.length} cached live row(s) across ${bySession.size} session(s) from browser storage`);
}

document.getElementById("chip-livecache").querySelector(".x").addEventListener("click", async () => {
  liveDb = liveDb || await idbOpen();
  await idbClearRows(liveDb);
  await loadLiveCacheIntoSessions();
  logLine("live cache cleared from browser storage.");
});

// ---- live session: device connection (buttplug-js@5, Buttplug Spec v3 -- verified 2026-08-24
// against the actual published source, not assumed from an older example. Method names are
// lowercase (connect/disconnect/startScanning/stopScanning), devices come back as a Map keyed by
// index (not an array), and per-message methods (SendLinearCmd etc.) are gone in favor of a
// unified device.hasOutput(type)/device.runOutput(cmd) pair -- see buttplug.OutputType /
// buttplug.DeviceOutput. Current gap, not silently worked around: this library no longer ships a
// direct/embedded Bluetooth connector at all (only the Intiface Central/Engine websocket relay),
// so "connect via Bluetooth" isn't available until that's resolved -- see the chat, not this
// comment, for the decision on what to do about it. ----
const OUTAGE_CENSOR_S = 20.0, PARK_S = 0.5;
let bp = { client: null, device: null, devKey: null, isVib: false, lastPos: null, up: false, kind: null, intifaceUrl: null };

function bpCaps(dev) {
  const T = buttplug.OutputType;
  return { linear: dev.hasOutput(T.HwPositionWithDuration), vibrate: dev.hasOutput(T.Vibrate), rotate: dev.hasOutput(T.Rotate) };
}

// Same identity rule as cumpredict.py's key_of/attach_device: the toy already running is the
// first choice on a reconnect, then anything linear-capable (what the model was fit on), then
// whatever's there. Modality is only RE-DERIVED on the first attach of a given device name --
// trusting a reconnect's own capability read over the session's already-established modality,
// because that read can be a still-settling BLE service-discovery race, not a different toy.
function bpPickDevice(devicesMap) {
  const devices = Array.from(devicesMap.values());
  if (!devices.length) throw new Error("no device found -- is Intiface running?");
  const same = devices.find((d) => d.name === bp.devKey);
  const linear = devices.find((d) => bpCaps(d).linear);
  const dev = same || linear || devices[0];
  const caps = bpCaps(dev);
  if (!caps.linear && !caps.vibrate && !caps.rotate)
    throw new Error(`'${dev.name}' exposes no actuator this page can drive`);
  return dev;
}
function bpAttach(dev) {
  const caps = bpCaps(dev);
  if (bp.devKey === null || dev.name !== bp.devKey) bp.isVib = !caps.linear && (caps.vibrate || caps.rotate);
  const changed = bp.devKey !== null && dev.name !== bp.devKey;
  bp.device = dev; bp.devKey = dev.name; bp.lastPos = null;
  return changed;
}

// The Bluetooth connector is a ~7MB WASM-compiled server (buttplug-wasm/buttplug-wasm-blob),
// nowhere near the size of the rest of this page -- loaded on demand via a dynamic import from
// esm.sh (which resolves its nested "buttplug-wasm-blob"/"eventemitter3" imports; the raw npm CDN
// files can't, they use bare specifiers a browser alone won't follow) only when Bluetooth is
// actually clicked, not on every page load. Built against buttplug@4.x, not the 5.x this page
// otherwise uses -- untested against real hardware; if it breaks, that's the likely reason.
async function bpMakeBluetoothConnector() {
  const mod = await import("https://esm.sh/buttplug-wasm@3.0.0");
  return new mod.ButtplugWasmClientConnector();
}

async function bpConnect(kind, intifaceUrl) {
  const client = new buttplug.ButtplugClient("cumpredict");
  const connector = kind === "bluetooth"
    ? await bpMakeBluetoothConnector()
    : new buttplug.ButtplugBrowserWebsocketClientConnector(intifaceUrl);
  await client.connect(connector);
  logLine(`connected (${kind}); scanning -- power the toy on now (up to 90s)`);
  await client.startScanning();
  const t0 = performance.now();
  while (performance.now() - t0 < 90000 && client.devices.size === 0) await sleepMs(2000);
  await client.stopScanning();
  const dev = bpPickDevice(client.devices);
  const changed = bpAttach(dev);
  bp.client = client; bp.kind = kind; bp.intifaceUrl = intifaceUrl;
  const caps = bpCaps(dev);
  const capList = ["linear", "vibrate", "rotate"].filter((k) => caps[k]).join(", ") || "none";
  logLine(`device: ${dev.name} [${capList}] -- modality: ${bp.isVib ? "VIBRATION (uncalibrated, trust your presses)" : "LINEAR"}`);
  return changed;
}

async function bpReconnect() {
  logLine("connection lost -- reconnecting...");
  if (bp.client) { try { await bp.client.disconnect(); } catch (e) {} }
  const changed = await bpConnect(bp.kind, bp.intifaceUrl);
  await bpPark();
  return changed;
}

// One retry, same as cumpredict.py's drive(): a single slow command must not cost the session,
// but a device that's genuinely gone should surface within a couple seconds, not hang the loop.
async function bpDrive(lo, hi, dur) {
  const dev = bp.device, caps = bpCaps(dev), D = buttplug.DeviceOutput;
  for (const attempt of [1, 2]) {
    try {
      if (caps.linear) {
        const tgt = bp.up ? hi : lo;
        await withTimeout(dev.runOutput(D.PositionWithDuration.percent(tgt, Math.round(Math.max(dur, 0.05) * 1000))), Math.max(1000, dur * 1000));
        bp.up = !bp.up;
        return tgt;
      }
      if (caps.vibrate) { await withTimeout(dev.runOutput(D.Vibrate.percent(hi)), 5000); return hi; }
      if (caps.rotate) { await withTimeout(dev.runOutput(D.Rotate.percent(hi)), 5000); return hi; }
      return null;
    } catch (err) {
      logLine(`CMD ERROR (${attempt}/2) ${err.message}`);
      if (attempt === 1) await sleepMs(300);
    }
  }
  return null;
}

async function bpPark() {
  if (!bpCaps(bp.device).linear) return;
  if ((await bpDrive(0.0, 0.0, PARK_S)) !== null) {
    await sleepMs(PARK_S * 1000);
    bp.lastPos = 0.0; bp.up = false;
    logLine("parked at 0.00");
  }
}

// ---- live session: main loop, mirrors cmd_live's main_loop() in cumpredict.py. mode "manual" has
// no Director at all (same as Python) -- it's driven by the small "test" icon next to the device
// name, not the mode checkboxes, and liveDirector may be null for the whole call in that case. ----
let liveDirector = null, liveStreamer = null, liveModelHash = null, liveCancelToken = null, liveActive = null;

function manualAction(manLevel) {
  const C = window.CumPredict;
  const [dLo, dHi] = C.POLICY_BOUNDS[C.POLICY_NAMES.indexOf("dur_hi")];
  return [0.0, manLevel, dHi - (dHi - dLo) * manLevel];
}

function renderLiveStatus(s) {
  const bar = "#".repeat(Math.max(0, Math.floor(s.A * 22))).padEnd(22, " ");
  const el = document.getElementById("trainprogress");
  if (s.mode === "manual") {
    el.textContent = `${bar} ${s.A.toFixed(2)} | MANUAL level ${s.man.toFixed(2)} | depth ${s.hi.toFixed(2)} @ ${s.dur.toFixed(2)}s`;
    return;
  }
  const elapsedMs = performance.now() - s.t0;
  const em = Math.floor(elapsedMs / 60000), es = Math.floor((elapsedMs % 60000) / 1000);
  const elapsed = es === 0 ? `+${em}m` : `+${em}m${String(es).padStart(2, "0")}s`;
  const lastS = s.lastlab >= 0 ? s.lastlab.toFixed(2) : (s.mode === "auto" ? "auto" : "--");
  el.textContent = `${elapsed} guessed arousal ${liveDirector.corrected(s.A).toFixed(2)} | your arousal ${lastS} ` +
    `| cycle ${liveDirector.cycles} | stroke ${s.lo.toFixed(2)}-${s.hi.toFixed(2)}`;
}

async function nextLiveSessionLabel() {
  const rows = await idbGetAllRows(liveDb);
  let max = 0;
  for (const r of rows) {
    const m = /^(?:VIB_)?live(\d+)$/.exec(r.session);
    if (m) max = Math.max(max, parseInt(m[1], 10));
  }
  return (bp.isVib ? "VIB_" : "") + "live" + (max + 1);
}

async function liveMainLoop(mode, signal) {
  let man = 0.0;
  if (mode !== "manual") liveDirector.setModality(bp.isVib ? "vib" : "linear");
  const vibAtStart = bp.isVib;
  let stopWriting = false;
  const sessionLabel = mode === "label" ? await nextLiveSessionLabel() : null;
  let en = 0, rowsWritten = 0, lastlab = -1;
  const t0 = performance.now();
  let fails = 0, outage = 0, censored = false, A = 0.0;
  let [lo, hi, dur] = mode === "manual" ? manualAction(man) : liveDirector.nextAction();
  logLine(`--- ${mode.toUpperCase()}${sessionLabel ? " " + sessionLabel : ""} ---`);
  if (mode === "label") logLine("rate your arousal 0-9 as you go -- numpad, say it out loud, or drag the slider below.");
  try {
    while (!signal.cancelled) {
      const ramp = (performance.now() - t0) / 1000;
      if (ramp < 60.0 && mode !== "manual") hi = Math.min(hi, lo + (0.30 + 0.60 * ramp / 60.0) * (hi - lo));
      const tSend = performance.now();
      const pos = await bpDrive(lo, hi, dur);
      if (signal.cancelled) break;
      if (pos === null) {
        fails += 1;
        if (fails >= 2) {
          try {
            const changed = await bpReconnect();
            if (mode !== "manual") {
              if (changed) { logLine("different toy -- the running trial is discarded, not transferred"); liveDirector.censorCycle(); }
              liveDirector.setModality(bp.isVib ? "vib" : "linear");
              if (mode === "label" && bp.isVib !== vibAtStart && !stopWriting) {
                stopWriting = true;
                logLine("modality changed mid-session -- the rest of this session is driven and scored but not recorded");
              }
            }
            fails = 0;
          } catch (e) { logLine(`reconnect failed: ${e.message}`); await sleepMs(3000); }
        }
        const outDt = Math.max((performance.now() - tSend) / 1000, dur);
        outage += outDt;
        liveDrainPresses();
        A = liveStreamer.step(0.0, outDt);
        if (mode === "manual") { [lo, hi, dur] = manualAction(man); }
        else {
          if (outage > OUTAGE_CENSOR_S) { if (!censored) { liveDirector.censorCycle(); censored = true; } }
          else liveDirector.commitObservation(A, outDt, false);
          [lo, hi, dur] = liveDirector.nextAction();
        }
        continue;
      }
      fails = 0; outage = 0; censored = false;
      const tMove = performance.now();
      while (performance.now() - tMove < dur * 1000) {
        if (signal.cancelled) break;
        await sleepMs(5);
      }
      if (signal.cancelled) break;
      const presses = liveDrainPresses();
      const wall = (performance.now() - tSend) / 1000;
      let stim;
      if (bp.isVib) stim = hi;
      else if (bp.lastPos === null) { stim = null; bp.lastPos = pos; }
      else { stim = Math.abs(pos - bp.lastPos); bp.lastPos = pos; }
      A = liveStreamer.step(stim === null ? 0.0 : stim, wall);
      let cum = false;
      if (mode === "manual") {
        for (const label of presses) man = label;
      } else if (mode === "auto") {
        liveDirector.notePress(Math.min(Math.floor(A * 9.0), 8) / 9.0);
      } else {
        for (const label of presses) {
          lastlab = label; en += 1;
          liveDirector.observe(label, A);
          liveDirector.notePress(label);
          if (label >= 1.0 && !cum) { logLine(`*** CUM at PRED=${A.toFixed(2)} cycle=${liveDirector.cycles} ***`); cum = true; liveStreamer.refract(); }
        }
      }
      if (stim !== null && mode === "label" && !stopWriting) {
        await idbAddRow(liveDb, { session: sessionLabel, time_elapse: wall / 60.0,
          intensity: Math.round(stim * 1000) / 1000, tired_level: presses.length ? presses[presses.length - 1] : "" });
        rowsWritten += 1;
      }
      renderLiveStatus({ A, mode, lo, hi, dur, t0, man, lastlab });
      if (mode === "manual") { [lo, hi, dur] = manualAction(man); continue; }
      liveDirector.commitObservation(A, wall, cum);
      [lo, hi, dur] = liveDirector.nextAction();
    }
  } finally {
    if (mode === "label") {
      try { await idbSetMeta(liveDb, "policy", liveDirector.prior(liveModelHash, liveDirector.mod)); }
      catch (e) { logLine(`policy not saved: ${e.message}`); }
      if (rowsWritten > 0 && en === 0) {
        await idbDeleteSession(liveDb, sessionLabel);
        logLine("no keypress all session -- discarded (unrated is missing, not zero)");
      } else if (rowsWritten > 0) {
        logLine(`saved ${en} label(s) as session ${sessionLabel} (${rowsWritten} rows) to browser storage`);
      }
      if (rowsWritten > 0) await loadLiveCacheIntoSessions();
    } else if (mode === "auto") {
      logLine("auto: nothing recorded, policy memory left as it was");
    }
    if (bp.device) { try { await bp.device.stop(); } catch (e) {} }
  }
}

// ---- live session: UI wiring ----
function refreshRunBtn() {
  if (liveActive) return; // mid-run/test -- don't fight the toggled "stop" label
  const btn = document.getElementById("runbtn");
  btn.disabled = !bp.device;
  btn.title = bp.device ? "" : "connect a device first";
}

async function liveConnectClick(kind) {
  const ibtn = document.getElementById("liveConnectIntiface"), bbtn = document.getElementById("liveConnectBluetooth");
  const orText = document.getElementById("connectOrText");
  if (typeof buttplug === "undefined") { logLine("ERROR: buttplug-js failed to load from the CDN (offline?) -- device connection isn't available."); return; }
  ibtn.disabled = bbtn.disabled = true;
  try {
    const url = document.getElementById("liveIntifaceUrl").value.trim() || "ws://127.0.0.1:12345";
    if (kind === "bluetooth") logLine("loading the Bluetooth WASM server (~7MB, first use only)...");
    await bpConnect(kind, url);
    document.getElementById("liveDeviceLabelText").textContent = `${bp.devKey} -- ${bp.isVib ? "vibration" : "linear"}`;
    document.getElementById("liveDeviceLabel").style.display = "";
    document.getElementById("liveDisconnect").style.display = "";
    ibtn.style.display = "none"; bbtn.style.display = "none"; orText.style.display = "none";
    document.getElementById("liveIntifaceUrl").style.display = "none";
    await bpPark();
    refreshRunBtn();
  } catch (err) {
    logLine(`connect failed: ${err.message}`);
    ibtn.disabled = bbtn.disabled = false;
  }
}
document.getElementById("liveConnectIntiface").addEventListener("click", () => liveConnectClick("intiface"));
document.getElementById("liveConnectBluetooth").addEventListener("click", () => liveConnectClick("bluetooth"));

document.getElementById("liveDisconnect").addEventListener("click", async () => {
  if (bp.client) { try { await bp.client.disconnect(); } catch (e) {} }
  bp = { client: null, device: null, devKey: null, isVib: false, lastPos: null, up: false, kind: null, intifaceUrl: null };
  document.getElementById("liveDeviceLabel").style.display = "none";
  document.getElementById("liveDisconnect").style.display = "none";
  document.getElementById("liveIntifaceUrl").style.display = "";
  const ibtn = document.getElementById("liveConnectIntiface"), bbtn = document.getElementById("liveConnectBluetooth");
  ibtn.disabled = bbtn.disabled = false; ibtn.style.display = ""; bbtn.style.display = "";
  document.getElementById("connectOrText").style.display = "";
  logLine("disconnected");
  refreshRunBtn();
});

document.getElementById("liveTestToggle").addEventListener("click", async () => {
  const C = window.CumPredict;
  const btn = document.getElementById("liveTestToggle");
  if (liveActive === "test") { if (liveCancelToken) liveCancelToken.cancelled = true; return; }
  if (liveActive) return;
  if (!bundledModel) { logLine("ERROR: no model.json loaded -- can't predict without predictor params."); return; }
  liveActive = "test";
  btn.textContent = "stop";
  document.getElementById("runbtn").disabled = true;
  document.getElementById("trainPredictorBtn").disabled = true;
  const signal = liveCancelToken = { cancelled: false };
  liveStreamer = new C.CoreStreamer(JSON.parse(bundledModel).core_params, null);
  liveDirector = null;
  try { await liveMainLoop("manual", signal); }
  catch (err) { logLine(`\nERROR: ${err.message}`); }
  finally {
    btn.textContent = "test";
    document.getElementById("trainPredictorBtn").disabled = false;
    liveActive = null; liveCancelToken = null;
    refreshRunBtn();
  }
});

// "run": go live with whatever model is currently active (bundled / trained / loaded from a file).
// Needs a connected device; does NOT train -- that's its own button below, since training needs
// data, not a toy, and shouldn't make anyone sit through a device-connect ceremony first.
document.getElementById("runbtn").addEventListener("click", async () => {
  const C = window.CumPredict;
  const btn = document.getElementById("runbtn");
  if (liveActive === "run") { if (liveCancelToken) { liveCancelToken.cancelled = true; logLine("\nstopping..."); } return; }
  if (liveActive) return;
  if (!bundledModel || !bundledEncoder) { logLine('ERROR: no model.json/encoder.json loaded -- train one below or reload the page.'); return; }

  const mode = document.getElementById("autoMode").checked ? "auto" : "label";
  liveDb = liveDb || await idbOpen();
  clearLog("");
  liveActive = "run";
  btn.textContent = "stop"; btn.classList.remove("primary"); btn.classList.add("stopbtn");
  document.getElementById("autoMode").disabled = true;
  document.getElementById("liveTestToggle").disabled = true;
  document.getElementById("trainPredictorBtn").disabled = true;
  const signal = liveCancelToken = { cancelled: false };
  try {
    const coreParams = JSON.parse(bundledModel).core_params;
    const encoderObj = JSON.parse(bundledEncoder);
    liveModelHash = encoderObj.predictor;
    liveStreamer = new C.CoreStreamer(coreParams, null);
    const prior = mode === "label" ? await idbGetMeta(liveDb, "policy") : null;
    liveDirector = new C.Director(new C.RuntimeRNG(), coreParams, prior, encoderObj);
    await liveMainLoop(mode, signal);
  } catch (err) {
    if (err instanceof C.CancelledError) logLine("\ncancelled.");
    else logLine(`\nERROR: ${err.message}`);
  } finally {
    btn.textContent = "run"; btn.classList.add("primary"); btn.classList.remove("stopbtn");
    document.getElementById("autoMode").disabled = false;
    document.getElementById("liveTestToggle").disabled = false;
    document.getElementById("trainPredictorBtn").disabled = false;
    liveActive = null; liveCancelToken = null;
    refreshRunBtn();
  }
});

// "train predictor": independent of "run" and of any device -- refits predictor+hazard+encoder
// from sessions (bundled + your uploaded CSV + any browser-cached live data), slow (5-20 min), only
// shown once there's actually new data (see refreshTrainRow). The result becomes the active model
// via setActiveModel, which also persists it to IndexedDB and is what a later "run" click will use.
document.getElementById("trainPredictorBtn").addEventListener("click", async () => {
  const C = window.CumPredict;
  const btn = document.getElementById("trainPredictorBtn");
  if (liveActive === "train") { if (liveCancelToken) { liveCancelToken.cancelled = true; logLine("\nstopping..."); } return; }
  if (liveActive) return;

  const progress = document.getElementById("trainprogress");
  clearLog("");
  liveActive = "train";
  btn.textContent = "stop";
  document.getElementById("runbtn").disabled = true;
  document.getElementById("liveTestToggle").disabled = true;
  const signal = liveCancelToken = { cancelled: false };
  try {
    const training = C.trainingSessions(sessions, logLine);
    logLine(`${training.length} session(s) pass the training gates`);
    if (!training.length) throw new Error("no trainable sessions -- every session had zero keypresses");
    const rng = new C.RuntimeRNG();
    logLine("\nfitting predictor core (CEM -- this takes a while)...");
    const fitStart = Date.now();
    const { core, loss } = await C.fitCore(training, rng, {
      signal,
      onProgress: (r, it, restarts, iters, bestLoss) => {
        progress.textContent = `fitting core: restart ${r + 1}/${restarts}, iter ${it + 1}/${iters}, best loss ${bestLoss.toFixed(4)}`;
      },
    });
    logLine(`core fit done in ${((Date.now() - fitStart) / 1000).toFixed(1)}s, loss=${loss.toFixed(4)}`);
    logLine("\nfitting first-cum hazard...");
    const { h0, sharp } = C.fitFirstCumHazard(training, core);
    logLine(`hazard: h0=${h0.toFixed(5)} sharp=${sharp.toFixed(1)}`);
    logLine("\ntraining encoder (several minutes)...");
    const trainStart = Date.now();
    const result = await C.trainEncoder(core, [h0, sharp], rng, {
      signal,
      onProgress: (step, iters, lastLoss) => {
        progress.textContent = `training encoder: step ${step}/${iters}, loss ${lastLoss.toFixed(5)}`;
      },
    });
    logLine(`encoder trained in ${((Date.now() - trainStart) / 1000).toFixed(1)}s, held-out MSE=${result.heldMSE.toFixed(6)}`);
    logLine(`numpy/autodiff parity skew=${result.skew.toExponential(2)} (gate: must be < 1e-3)`);
    const modelText = JSON.stringify({ core_names: C.CORE_NAMES, hazard: [h0, sharp], core_params: core });
    const predictorHash = await sha1Hex10(modelText);
    const encoderText = JSON.stringify({ predictor: predictorHash, w: result.weights, dmin: result.dmin, drange: result.drange });
    trainResult = { modelText, encoderText };
    await setActiveModel(modelText, encoderText, "trained");
    document.getElementById("exportRow").style.display = "";
    logLine(`predictor hash: ${predictorHash}`);
    progress.textContent = "done.";
  } catch (err) {
    if (err instanceof C.CancelledError) { logLine("\ncancelled."); progress.textContent = "cancelled."; }
    else { logLine(`\nERROR: ${err.message}`); progress.textContent = "failed."; }
  } finally {
    btn.textContent = "train predictor";
    document.getElementById("runbtn").disabled = !bp.device;
    document.getElementById("liveTestToggle").disabled = false;
    liveActive = null; liveCancelToken = null;
  }
});

document.getElementById("exportbtn").addEventListener("click", () => {
  if (!trainResult) return;
  for (const [name, text] of [["model.json", trainResult.modelText], ["encoder.json", trainResult.encoderText]]) {
    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
});

loadDefaults().then(loadLiveCacheIntoSessions).then(restoreActiveModelFromCache);
refreshRunBtn();
</script>
